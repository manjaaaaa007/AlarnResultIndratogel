<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Transaction Text Parser</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
      font-weight: 600;
    }

    label {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 8px;
      display: block;
    }

    textarea {
      width: 100%;
      height: 220px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      padding: 12px;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      margin-bottom: 24px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-parse {
      background: #0284c7;
      color: #ffffff;
    }

    .btn-parse:hover {
      background: #0369a1;
    }

    .btn-copy {
      background: #10b981;
      color: #ffffff;
    }

    .btn-copy:hover {
      background: #059669;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #334155;
      max-height: 400px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
    }

    th {
      background-color: #1e293b;
      color: #38bdf8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background-color: rgba(15, 23, 42, 0.4);
    }

    .empty-cell {
      color: #64748b;
      font-style: italic;
    }

    .negative {
      color: #ef4444;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Bulk Transaction Text Parser</h2>
    
    <label for="inputText">Tempelkan Teks Transaksi di Sini:</label>
    <textarea id="inputText" placeholder="Masukkan data mentah transaksi..." oninput="parseData()"></textarea>
    
    <div class="btn-group">
      <button class="btn-parse" onclick="parseData()">Proses Data</button>
      <button class="btn-copy" onclick="copyTableData()">Salin Semua Hasil (Excel/Sheets)</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Kolom A</th>
            <th>Kolom B</th>
            <th>Kolom C</th>
            <th>Kolom D</th>
          </tr>
        </thead>
        <tbody id="resultBody">
          <tr>
            <td colspan="4" style="text-align: center; color: #64748b;">Belum ada data diproses.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let parsedResults = [];

    function parseData() {
      const rawText = document.getElementById('inputText').value;
      const tbody = document.getElementById('resultBody');
      parsedResults = [];

      if (!rawText.trim()) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: #64748b;">Belum ada data diproses.</td>
          </tr>`;
        return;
      }

      // Ambil semua Order ID
      const orders = [];
      const orderRegex = /Order\s*:\s*([^\s\r\n]+)/gi;
      let orderMatch;
      while ((orderMatch = orderRegex.exec(rawText)) !== null) {
        orders.push(orderMatch[1].trim());
      }

      // Ambil semua Username & Nominal (Pola: [Nama Rek : ... No Rek : ...] [Username] [Nominal])
      // Pencarian fleksibel tanpa terpatok pemisah baris \n
      const userNominalRegex = /No\s*Rek\s*:\s*\d+[\s\r\n]+([a-zA-Z0-9_]+)[\s\t]+([\d]+(?:\.[\d]+)+)/gi;
      const userNominals = [];
      let unMatch;
      while ((unMatch = userNominalRegex.exec(rawText)) !== null) {
        userNominals.push({
          user: unMatch[1].trim(),
          nominal: `(${unMatch[2].trim()})`
        });
      }

      // Gabungkan data berdasarkan urutan kemunculan
      const totalRows = Math.max(orders.length, userNominals.length);

      for (let i = 0; i < totalRows; i++) {
        const colA = userNominals[i] ? userNominals[i].user : '';
        const colB = orders[i] ? orders[i] : '';
        const colC = '';
        const colD = userNominals[i] ? userNominals[i].nominal : '';

        if (colA || colB || colD) {
          parsedResults.push({ colA, colB, colC, colD });
        }
      }

      if (parsedResults.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: #ef4444;">Data tidak dapat dibaca, pastikan teks mentah lengkap.</td>
          </tr>`;
        return;
      }

      // Render ke tabel
      tbody.innerHTML = parsedResults.map(item => `
        <tr>
          <td>${item.colA || '-'}</td>
          <td>${item.colB || '-'}</td>
          <td class="empty-cell">[Kosong]</td>
          <td class="${item.colD ? 'negative' : ''}">${item.colD || '-'}</td>
        </tr>
      `).join('');
    }

    function copyTableData() {
      if (!parsedResults.length) {
        alert('Tidak ada data untuk disalin!');
        return;
      }

      const textToCopy = parsedResults
        .map(row => `${row.colA}\t${row.colB}\t${row.colC}\t${row.colD}`)
        .join('\n');

      navigator.clipboard.writeText(textToCopy).then(() => {
        alert(`${parsedResults.length} data berhasil disalin! Tinggal Paste (Ctrl+V) ke Excel / Google Sheets.`);
      }).catch(err => {
        alert('Gagal menyalin data: ' + err);
      });
    }
  </script>

</body>
</html>
